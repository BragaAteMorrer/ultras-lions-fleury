services:

  php:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    container_name: ultras_lions_php
    working_dir: /var/www
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: ultras_lions_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mariadb:11
    container_name: ultras_lions_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ultras_lions
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ultras_lions_phpmyadmin
    environment:
      PMA_HOSTS: ultras_lions_db
      PMA_PORTS: 3306
      PMA_ARBITRARY: 1
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db
  
  # node:
