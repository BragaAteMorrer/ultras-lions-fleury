security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email   # login par l'email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                csrf_token_id: authenticate

            logout:
                path: app_logout
                target: /

            # nécessaire pour se souvenir de la session
            remember_me:
                secret: '%kernel.secret%'

    role_hierarchy:
        ROLE_ADMIN: [ROLE_BUVETTE]

    access_control:
        # Admin uniquement
        - { path: ^/admin/buvette/preparation(?:/|$), roles: ROLE_BUVETTE }
        - { path: ^/admin, roles: ROLE_ADMIN }

        # Accès réservé aux membres connectés
        - { path: ^/table-de-vente, roles: PUBLIC_ACCESS }
        - { path: ^/billetterie, roles: PUBLIC_ACCESS }

        # Pages utilisateur connectées
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/profil, roles: ROLE_USER }

        # Page d'inscription accessible si pas connecté
        - { path: ^/register, roles: PUBLIC_ACCESS }

        # Page de login accessible si pas connecté
        - { path: ^/login, roles: PUBLIC_ACCESS }
