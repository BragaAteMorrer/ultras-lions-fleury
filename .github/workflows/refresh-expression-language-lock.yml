name: Refresh Symfony expression-language lock
on:
  push:
    branches:
      - fix/p0-symfony-expression-security-20261019
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Resolve patched Symfony package
        working-directory: backend
        run: composer update symfony/expression-language --with-dependencies --no-interaction --no-scripts
      - name: Commit updated Composer lockfile
        run: |
          if git diff --quiet -- backend/composer.lock; then
            echo "No lockfile changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/composer.lock
          git commit -m "security: refresh expression-language lockfile"
          git push origin HEAD:fix/p0-symfony-expression-security-20261019
